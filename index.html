<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>จดเงิน</title>
<meta name="description" content="จดรายรับรายจ่าย ปฏิทินรายวัน รายจ่ายประจำ สินทรัพย์ สั่งด้วยเสียง">
<meta name="theme-color" content="#f2ede6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="จดเงิน">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700;800&display=swap" rel="stylesheet">
<script>try{var m=localStorage.getItem('jdn-mode')||'light';if(m==='auto')m=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=m}catch(e){}</script>
<style>
:root{--bg:#f2ede6;--dot:#d8cdbf;--card:#faf7f2;--ink:#1b1a18;--mut:#6b645c;--mut2:#4a443e;--acc:#b93a1c;--acc2:#f0a58f;--inc:#2d7a4b;--trk:#e3dbd0;--sel:#f6e2da;--fut:#a39a8f;--soft:#cfc6bb;--shade:rgba(27,26,24,.45);--onacc:#fff;--deep:#7a2512;
--sans:'Inter Tight','IBM Plex Sans Thai',system-ui,-apple-system,sans-serif;--mono:'IBM Plex Mono','IBM Plex Sans Thai',ui-monospace,monospace;color-scheme:light}
[data-theme=dark]{--bg:#151412;--dot:#2c2925;--card:#1f1d1a;--ink:#efe9e1;--mut:#a39a8f;--mut2:#c9c0b5;--acc:#ef7a57;--acc2:#b93a1c;--inc:#62c98f;--trk:#35312c;--sel:#3a2620;--fut:#6b645c;--soft:#4a443e;--shade:rgba(0,0,0,.6);--onacc:#151412;--deep:#f6c3b2;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:16px 16px;color:var(--ink);font:400 15px/1.45 var(--sans);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.s{width:18px;height:18px}
.wrap{max-width:430px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 20px calc(100px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.lbl{font:600 12px/1.4 var(--mono);letter-spacing:.08em;color:var(--acc)}
.mono{font-family:var(--mono)}
.mut{color:var(--mut)}.mut2{color:var(--mut2)}.red{color:var(--acc)}.grn{color:var(--inc)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
h3{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.01em}
p{margin:0}
.lead{font-size:15px;line-height:1.5;color:var(--mut2);margin-top:6px}
.hero{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:2px;overflow-wrap:anywhere}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:18px;padding:16px 18px}
.card.ink{background:var(--ink);color:var(--card)}
.card.ink .lbl{color:var(--acc2)}
.card.alert{border-color:var(--acc);background:var(--sel)}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.num{font-family:var(--mono);font-weight:600}
.btn{min-height:48px;border-radius:999px;border:1.5px solid var(--ink);background:var(--card);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 18px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.pri{background:var(--ink);color:var(--card);font-weight:700}
.btn.ic{width:48px;padding:0;flex:none}
.btn.sm{min-height:40px;font-size:14px;padding:0 14px}
.btn.wide{width:100%}
.btn.danger{color:var(--acc);border-color:var(--acc)}
.btn:disabled{opacity:.45}
.btn:active,.pill:active,.tile:active{transform:scale(.97)}
.link{background:none;border:0;padding:6px 0;font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;color:var(--ink);display:inline-block;text-align:left}
.icb{width:44px;height:44px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--ink);flex:none;padding:0}
.icb.sm{width:36px;height:36px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);font-weight:600;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill[aria-pressed=true]{background:var(--ink);color:var(--card)}
.seg{display:flex;padding:3px;border:1.5px solid var(--ink);border-radius:999px;background:var(--card);gap:2px}
.seg button{flex:1;min-height:38px;border:0;border-radius:999px;background:transparent;font-weight:600;font-size:14px;padding:0 10px;color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--card);font-weight:700}
.bar{height:10px;border-radius:6px;background:var(--trk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink);border-radius:6px}
.bar.g>i{background:var(--inc)}.bar.r>i{background:var(--acc)}
.rows{display:grid;grid-template-columns:minmax(0,1fr) auto;row-gap:10px;column-gap:12px;margin-top:12px;font-size:15px}
.rows>.t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:10px 0;text-align:left;color:var(--ink);border-top:1px solid var(--trk)}
.tr:first-child{border-top:0}
.tr .ti{width:40px;height:40px;border:1.5px solid var(--ink);border-radius:12px;display:grid;place-items:center;flex:none}
.tr .ti.inc{border-color:var(--inc);color:var(--inc)}
.tr .tm{flex:1;min-width:0}
.tr .tn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .ts{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .ta{font:600 15px var(--mono);white-space:nowrap}
.dbox{width:44px;text-align:center;border:1.5px solid var(--ink);border-radius:10px;padding:4px 0;flex:none}
.dbox b{display:block;font-weight:800;font-size:17px;line-height:1.1}
.dbox small{display:block;font:600 10px var(--mono);color:var(--mut)}
.dbox.hot small{color:var(--acc)}
.due{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.due .tm{flex:1;min-width:0}
.due .tn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due .ts{font-size:13px;color:var(--mut)}
.due.hot .ts{color:var(--acc);font-weight:600}
.due.past{opacity:.5}
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center;padding:12px 6px}
.strip>div+div{border-left:1px solid var(--trk)}
.strip small{display:block;font:600 11px var(--mono);letter-spacing:.06em;color:var(--mut)}
.strip b{display:block;font:600 16px var(--mono);margin-top:2px;overflow-wrap:anywhere}
.mnav{display:flex;align-items:center;gap:4px}
.mnav button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--ink);background:var(--card);font-size:18px;line-height:1;display:grid;place-items:center;padding:0;color:var(--ink)}
.mnav span{font:600 14px var(--mono);min-width:86px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{text-align:center;font:600 11px var(--mono);color:var(--mut);padding-bottom:4px}
.cal .d{min-height:62px;padding:6px 1px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:1.5px solid transparent;color:var(--ink)}
.cal .d.fut{color:var(--fut)}
.cal .d.now{border-color:var(--ink)}
.cal .d.on{border-color:var(--acc);background:var(--sel)}
.cal .d b{font-weight:700;font-size:14px;line-height:1}
.cal .d i{font:normal 600 11px var(--mono);line-height:1.1}
.cal .d .p{color:var(--inc)}.cal .d .m{color:var(--acc)}
.legend{display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:12px;color:var(--mut)}
.fab{position:fixed;right:max(20px,calc(50% - 195px));bottom:calc(88px + env(safe-area-inset-bottom));z-index:15;min-height:54px;padding:0 22px 0 18px;border-radius:999px;border:0;background:var(--ink);color:var(--card);font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.brow{display:grid;grid-template-columns:96px minmax(0,1fr) 46px;align-items:center;gap:10px;font-size:14px}
.brow>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .n{text-align:right;font:500 14px var(--mono)}
.irow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:10px}
.ins{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--trk)}
.ins:first-of-type{border-top:0;padding-top:4px}
.ins b{font:600 13px var(--mono);color:var(--acc);flex:none;padding-top:2px}
.chart{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;height:130px;margin-top:14px;border-bottom:1.5px solid var(--ink)}
.chart>div{display:flex;gap:3px;align-items:end;justify-content:center;height:100%}
.chart i{width:14px;border-radius:4px 4px 0 0;background:var(--ink);display:block;min-height:2px}
.chart i.g{background:var(--inc)}.chart i.r{background:var(--acc)}
.chx{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;text-align:center;font:500 11px var(--mono);color:var(--mut);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1.5px solid var(--ink);border-radius:16px;padding:12px 14px}
.stat small{display:block;font-size:13px;color:var(--mut)}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.stack{display:flex;height:18px;border-radius:9px;overflow:hidden;border:1.5px solid var(--ink);background:var(--trk)}
.stack i{display:block;height:100%}
.stack i+i{border-left:2px solid var(--card)}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--mut2)}
.key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.arow{display:flex;justify-content:space-between;gap:12px;width:100%;padding:9px 0;background:none;border:0;border-top:1px solid var(--trk);text-align:left;color:var(--ink);font-size:15px}
.arow:first-child{border-top:0}
.arow .num{font-weight:500}
.arow.tot{font-weight:700}.arow.tot .num{font-weight:700}
.group{display:flex;flex-direction:column}
.group>.gl{font:600 12px var(--mono);letter-spacing:.08em;color:var(--acc);margin:6px 0 8px}
.set{background:var(--card);border:1.5px solid var(--ink);border-radius:18px;overflow:hidden}
.set>*{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:54px;padding:10px 16px;background:none;border:0;border-top:1px solid var(--trk);text-align:left;color:var(--ink);font-size:15px;text-decoration:none}
.set>*:first-child{border-top:0}
.set .v{color:var(--mut);font-size:14px;display:flex;align-items:center;gap:6px;text-align:right}
.set .warn{color:var(--acc);font-weight:600}
.sw{position:relative;width:50px;height:30px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--trk);border:1.5px solid var(--ink);transition:background .15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--card);border:1.5px solid var(--ink);transition:transform .15s}
.sw input:checked+span{background:var(--ink)}
.sw input:checked+span::after{transform:translateX(20px)}
.sw input:focus-visible+span{outline:2.5px solid var(--acc);outline-offset:2px}
.chk{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--trk)}
.chk:first-child{border-top:0}
.chk input[type=checkbox]{width:24px;height:24px;margin:0;accent-color:var(--ink);flex:none}
.chk .tm{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.chk .tn{font-weight:600}
.chk .ts{font-size:13px;color:var(--mut)}
.chk.off .tn,.chk.off .num{color:var(--mut)}
.step{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:var(--ink);width:100%;text-align:left;font-size:15px}
.step .no{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.step.done .no{background:var(--ink);color:var(--card)}
.banner{display:flex;align-items:center;gap:12px;font-size:14px}
.banner .tm{flex:1}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;border-top:1.5px solid var(--ink);background:var(--card);padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:430px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.tabs a{min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font-size:12px;font-weight:600;color:var(--ink)}
nav.tabs a[aria-current=page]{color:var(--acc);font-weight:700}
.page{position:fixed;inset:0;z-index:40;overflow-y:auto;-webkit-overflow-scrolling:touch;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:16px 16px}
.page .wrap{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.amt{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--ink);padding:4px 0 6px}
.amt span{font-size:32px;font-weight:800;color:var(--mut)}
.amt input{flex:1;min-width:0;border:0;background:transparent;font-size:46px;font-weight:800;letter-spacing:-.02em;padding:0;outline:none;color:var(--ink)}
.amt input::placeholder{color:var(--soft)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{min-height:72px;border-radius:16px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-weight:600;font-size:13px;line-height:1.2;padding:6px 4px;text-align:center}
.tile[aria-pressed=true]{background:var(--ink);color:var(--card)}
.tile.dash{border-style:dashed}
.fl{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.fl>small{font-weight:400;color:var(--mut);font-size:13px}
.inp{min-height:48px;border:1.5px solid var(--ink);border-radius:12px;background:var(--card);padding:0 12px;width:100%;font-size:16px;font-weight:500;color:var(--ink)}
textarea.inp{padding:10px 12px;min-height:84px;resize:vertical}
select.inp{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.acts{display:flex;gap:8px;margin-top:4px}
.acts>.btn{flex:1}
.from{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1.5px dashed var(--acc);border-radius:14px;color:var(--acc);font-size:14px;font-weight:600;background:var(--sel)}
.err{color:var(--acc);font-size:14px;font-weight:600;min-height:1em}
.sheet{position:fixed;inset:0;z-index:60;background:var(--shade);display:flex;align-items:flex-end;justify-content:center}
.sheet .pan{width:100%;max-width:480px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border:1.5px solid var(--ink);border-bottom:0;border-radius:22px 22px 0 0;padding:18px 20px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--soft);margin:-6px auto 0}
.icons{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.icons button{aspect-ratio:1;border-radius:12px;border:1.5px solid var(--ink);background:var(--card);display:grid;place-items:center;color:var(--ink);padding:0}
.icons button[aria-pressed=true]{background:var(--ink);color:var(--card)}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--trk)}
.mrow:first-child{border-top:0}
.mrow .tm{flex:1;min-width:0;font-weight:600}
.mrow input{width:120px;text-align:right}
.rv{border:1.5px solid var(--ink);border-radius:16px;background:var(--card);padding:12px;display:flex;flex-direction:column;gap:8px}
.rv .two{gap:8px}
.rv .inp{min-height:42px;font-size:15px}
.map{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;align-items:center;font-size:14px}
.scroll{overflow-x:auto;border:1.5px solid var(--ink);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;font-size:13px;width:100%}
th,td{padding:6px 8px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--trk)}
td.n{text-align:right;font-family:var(--mono)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:80;max-width:calc(100% - 32px);width:max-content;background:var(--ink);color:var(--card);border-radius:14px;padding:12px 16px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast button{background:none;border:0;color:var(--acc2);font-weight:700;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.sal{background:var(--acc);color:var(--onacc);border-radius:18px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.sal>svg{width:24px;height:24px;margin-top:2px}
.sal-l{font:600 12px var(--mono);letter-spacing:.08em;opacity:.85}
.sal-t{font-size:17px;font-weight:700;margin-top:2px}
.sal-s{font-size:14px;opacity:.9;margin-top:2px}
.srow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--trk)}
.srow.dim{opacity:.55}
.srow .sd{width:40px;text-align:center;font:600 15px var(--mono);flex:none}
.srow.hot .sd{border:1.5px solid var(--acc);color:var(--acc);border-radius:10px;padding:4px 0}
.srow .sd.box{border:1.5px dashed var(--ink);border-radius:10px;padding:4px 0;font:800 15px/1.2 var(--sans)}
.srow .sd.box small{display:block;font:600 10px var(--mono);color:var(--mut)}
.srow .tm{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit}
.srow .tn{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow.hot .tn{font-weight:700}
.srow .ts{display:block;font-size:13px;color:var(--mut)}
.srow.hot .ts{color:var(--acc);font-weight:600}
.srow .sa{font:600 15px var(--mono);white-space:nowrap}
.srow.dim .sa{font-weight:500}
.srow .sj{min-height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-size:13px;font-weight:700;flex:none}

const diffD=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const DOW=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'],DOW_S=['อา','จ','อ','พ','พฤ','ศ','ส'];

const dShort=s=>{const d=pd(s);return d.getDate()+' '+MS[d.getMonth()]};
const dYear=s=>{const d=pd(s);return d.getDate()+' '+MS[d.getMonth()]+' '+String(d.getFullYear()+543).slice(2)};
const dFull=s=>{const d=pd(s);return DOW[d.getDay()]+' '+d.getDate()+' '+MS[d.getMonth()]+' '+(d.getFullYear()+543)};
const mLong=k=>{const[y,m]=k.split('-').map(Number);return ML[m-1]+' '+(y+543)};
const mMid=k=>{const[y,m]=k.split('-').map(Number);return MS[m-1]+' '+(y+543)};
const rel=s=>{const n=diffD(today(),s);return n===0?'วันนี้':n===1?'พรุ่งนี้':n===-1?'เมื่อวาน':n>1?'อีก '+n+' วัน':dShort(s)};
const relDay=s=>{const n=diffD(today(),s);return n===0?'วันนี้':n===-1?'เมื่อวาน':dShort(s)};
const money=n=>(Math.round((+n||0)*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
const B=n=>(n<0?'−':'')+'฿'+money(Math.abs(n));
const K=n=>{n=Math.abs(n);if(n<1000)return String(Math.round(n));const v=n/1000;return(v>=100?Math.round(v):v.toFixed(1).replace(/\.0$/,''))+'k'};
const pctS=x=>Math.round(x*100)+'%';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let seq=0;const uid=()=>Date.now().toString(36)+(seq++).toString(36)+Math.random().toString(36).slice(2,6);
const safeCol=c=>/^#[0-9a-f]{3,8}$/i.test(c||'')?c:'#888888';

/* fixed-cost dates */
const subReady=s=>s.on&&s.amt>0&&s.day>0&&(s.f!=='y'||s.mo>0);
function subDateIn(s,k){const[y,m]=k.split('-').map(Number);if(s.f==='y'&&s.mo!==m)return null;return k+'-'+pad(Math.min(s.day,daysIn(k)))}
function subNext(s,from){from=from||today();const k=from.slice(0,7);
 if(s.f==='y'){let y=+from.slice(0,4);for(let i=0;i<2;i++){const kk=(y+i)+'-'+pad(s.mo),d=subDateIn(s,kk);if(d>=from)return d}return null}
 for(let i=0;i<2;i++){const d=subDateIn(s,addM(k,i));if(d>=from)return d}return null}
function subPaid(s,k){return monthTx(k).find(t=>t.sub===s.id)||null}
const subsOn=()=>S.subs.filter(subReady);
const monthlyFixed=()=>subsOn().filter(s=>s.f==='m').reduce((a,s)=>a+s.amt,0);
const yearlyFixed=()=>monthlyFixed()*12+subsOn().filter(s=>s.f==='y').reduce((a,s)=>a+s.amt,0);
function fixedInMonth(k){return subsOn().reduce((a,s)=>a+(subDateIn(s,k)?s.amt:0),0)}
// remaining (not yet recorded) fixed costs dated after today in the current month
function restOfMonth(){const k=thisM(),t=today();return subsOn().map(s=>({s,d:subDateIn(s,k)})).filter(x=>x.d&&x.d>t&&!subPaid(x.s,k)).sort((a,b)=>a.d.localeCompare(b.d))}
function upcoming(within){const t=today();return subsOn().map(s=>{const d=subNext(s,t);return{s,d,n:d?diffD(t,d):999}}).filter(x=>x.d&&x.n<=within&&!subPaid(x.s,x.d.slice(0,7))).sort((a,b)=>a.d.localeCompare(b.d)||b.s.amt-a.s.amt)}

function walBal(w){const w0=(S.wal[0]||{}).id;let b=+w.ob||0,n=0;for(const t of all())if((t.w||w0)===w.id){b+=t.t==='i'?t.a:-t.a;n++}return{b,n}}
function assetBal(a){let b=+a.bal||0;for(const t of all())if(t.as===a.id&&t.t==='e')b+=t.a;return b}
function looseInv(){let b=0;const ids=new Set(S.assets.map(a=>a.id));for(const t of all())if(isInv(t)&&!ids.has(t.as))b+=t.a;return b}
function efBase(){if(S.set.efBase>0)return S.set.efBase;const k=thisM();let tot=0,n=0;for(let i=1;i<=3;i++){const s=stats(monthTx(addM(k,-i)));if(s.sp>0){tot+=s.sp;n++}}return n?Math.round(tot/n/100)*100:monthlyFixed()}

// category usually used with this amount (e.g. 70 → coffee)
function amountCat(a,t){const from=addD(today(),-180),ex={},nr={};
 for(const x of all()){if(x.t!==t||x.d<from||!S.cats.some(c=>c.id===x.c))continue;const d=Math.abs(x.a-a),add=(m)=>{const o=m[x.c]||(m[x.c]={n:0,last:''});o.n++;if(x.d>o.last)o.last=x.d};if(d<.01)add(ex);else if(d<=Math.max(5,a*.1))add(nr)}
 const best=m=>Object.entries(m).sort((p,q)=>q[1].n-p[1].n||q[1].last.localeCompare(p[1].last))[0];
 let b=best(ex);if(b)return{c:b[0],n:b[1].n};b=best(nr);return b&&b[1].n>=2?{c:b[0],n:b[1].n,near:1}:null}
function keepFocus(id,fn){const el=$('#'+id),pos=el?el.selectionStart:null;fn();const n=$('#'+id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
function defAsset(){try{const a=localStorage.getItem('jdn-lasta');if(a!==null&&(a===''||S.assets.some(x=>x.id===a)))return a}catch(e){}const i=S.assets.find(a=>a.k==='inv');return i?i.id:''}
function saveEntry(more){const a=calc(E.a);
 if(!(a>0)){E.err='ใส่จำนวนเงินก่อน';$('#eErr').textContent=E.err;$('#eA').focus();return}
 if(!S.cats.some(c=>c.id===E.c))E.c=defaultCat(E.t).id;
 const c=catOf(E.c),tx={id:E.edit||E.id,t:E.t,a,c:E.c,w:E.w,d:E.d||today(),n:E.n.trim(),src:E.src||'manual',ts:E.edit?(E.old.ts||Date.now()):Date.now()};
 if(E.sub)tx.sub=E.sub;if(E.t==='e'&&c.inv&&E.as)tx.as=E.as;
 setLastW(E.w);if(!S.welcomed){S.welcomed=1}
 if(E.edit){replaceTx(E.old,tx);closeEntry();toast('แก้ไขแล้ว');return}
 addTx([tx]);budAlert(tx);
 if(more){const keep={t:E.t,w:E.w,d:E.d};E={id:uid(),...keep,a:'',c:(topCats(keep.t)[0]||defaultCat(keep.t)).id,n:'',sub:'',src:'manual',as:'',from:'',touched:0,all:0,err:'',auto:'',hint:''};drawEntry();$('#eA').focus();toast(`บันทึก ${B(a)} แล้ว จดต่อได้เลย`);return}
 closeEntry();cur=tx.d.slice(0,7);TX.sel=tx.d;render();toast(`บันทึก ${B(a)} แล้ว`,'เลิกทำ',()=>removeTx([tx]))}
function budAlert(t){if(!S.set.nBud||t.t!=='e')return;const b=S.budgets[t.c];if(!(b>0))return;const k=t.d.slice(0,7),used=monthTx(k).filter(x=>x.c===t.c&&x.t==='e').reduce((a,x)=>a+x.a,0),before=used-t.a,c=short(catOf(t.c));
 if(used>b&&before<=b)setTimeout(()=>toast(`${c}เกินงบแล้ว ${B(used-b)}`),3300);else if(used>=b*.8&&before<b*.8)setTimeout(()=>toast(`${c}ใช้ไป ${pctS(used/b)} ของงบแล้ว`),3300)}

 <div class="acts"><button class="btn" data-close>ยกเลิก</button><button class="btn pri" id="rvGo">บันทึก ${RV.length} รายการ</button></div>`);
 $$('#rvL .rv').forEach(el=>{const i=+el.dataset.i;el.querySelector('.rt').onchange=e=>{syncRV();RV[i].t=e.target.value;RV[i].c=guessCat(RV[i].n,RV[i].t).id;openReview()};el.querySelector('.rx').onclick=()=>{syncRV();RV.splice(i,1);RV.length?openReview():closeSheet()}});
 $('#rvGo').onclick=()=>{syncRV();const ok=RV.filter(r=>r.a>0);if(!ok.length){$('#rvMsg').textContent='ใส่ยอดอย่างน้อย 1 รายการ';return}const L=ok.map(r=>({id:uid(),t:r.t,a:r.a,c:r.c,w:r.w||lastW(),d:r.d||today(),n:r.n||'',src:r.src||'manual',ts:Date.now()}));closeSheet();closeEntry();addTx(L);cur=L[0].d.slice(0,7);TX.sel=L[0].d;render();toast(`บันทึก ${L.length} รายการแล้ว`,'เลิกทำ',()=>removeTx(L))}}
function syncRV(){$$('#rvL .rv').forEach(el=>{const r=RV[+el.dataset.i];if(!r)return;const a=calc(el.querySelector('.ra').value);r.a=a>0?a:'';r.c=el.querySelector('.rc').value;r.d=el.querySelector('.rd').value||today();r.n=el.querySelector('.rn').value.trim()})}
function gotItems(items,msg){items=items.filter(Boolean);if(!items.length)return;if(items.length===1){const r=items[0];closeSheet();if(!$('#page').hidden&&E&&!E.edit){Object.assign(E,{t:r.t,a:r.a?String(r.a):'',c:r.c,d:r.d,n:r.n,src:r.src,touched:1});drawEntry()}else openEntry(null,{t:r.t,a:r.a?String(r.a):'',c:r.c,d:r.d,n:r.n,src:r.src});if(msg)toast(msg);return}RV=items;openReview(msg)}

let DIC=null,listening=false,partial='';
function webDictation(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;let rec=null,cbP=()=>{},cbF=()=>{},cbS=()=>{},stopping=false;
 return{onPartial(f){cbP=f},onFinal(f){cbF=f},onState(f){cbS=f},
  start(){return new Promise((res,rej)=>{try{rec=new SR();rec.lang='th-TH';rec.interimResults=true;rec.continuous=true;stopping=false;
   rec.onresult=e=>{let it='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)cbF({text:r[0].transcript});else it+=r[0].transcript}cbP({text:it})};
   rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')rej({code:'not_granted'})};
   rec.onend=()=>cbS({state:'idle',reason:stopping?'stopped':'ended'});
   rec.onstart=()=>{cbS({state:'listening'});res()};rec.start()}catch(e){rej({code:'unavailable'})}})},
  stop(){stopping=true;try{rec&&rec.stop()}catch(e){}return Promise.resolve()}}}

const TH_NUM={'ศูนย์':0,'หนึ่ง':1,'เอ็ด':1,'สอง':2,'ยี่':2,'สาม':3,'สี่':4,'ห้า':5,'หก':6,'เจ็ด':7,'แปด':8,'เก้า':9};
function thaiWords(s){return s.replace(/((?:หนึ่ง|เอ็ด|สอง|ยี่|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า|ศูนย์|สิบ|ร้อย|พัน|หมื่น|แสน|ล้าน)+)/g,m=>{let tot=0,cur=0,num=null;const re=/หนึ่ง|เอ็ด|สอง|ยี่|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า|ศูนย์|สิบ|ร้อย|พัน|หมื่น|แสน|ล้าน/g;let t;
 while((t=re.exec(m))){const w=t[0];if(w in TH_NUM)num=TH_NUM[w];else{const u={'สิบ':10,'ร้อย':100,'พัน':1e3,'หมื่น':1e4,'แสน':1e5,'ล้าน':1e6}[w];if(u===1e6){tot=(tot+cur+(num||0))*1e6;cur=0}else cur+=(num===null?1:num)*u;num=null}}
 const v=tot+cur+(num||0);return v>0?' '+v+' ':m})}
function localParse(txt){txt=thaiWords(txt);const out=[],re=/([^\d]*?)(\d[\d,]*(?:\.\d+)?)\s*(?:บาท|฿|baht)?/gi;let m;

function toCSV(L){const q=v=>{v=String(v??'');if(/^[=+\-@]/.test(v)&&isNaN(+v))v="'"+v;return/["\n\r\t,;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};return[HEAD,...L.map(rowOf)].map(r=>r.map(q).join(',')).join('\r\n')}
function openExport(){let rg='m';const rows=()=>all().filter(t=>rg==='a'||(rg==='m'?t.d.startsWith(cur):t.d.startsWith(cur.slice(0,4)))).sort((a,b)=>a.d.localeCompare(b.d)),tag=()=>rg==='m'?cur:rg==='y'?cur.slice(0,4):'all';
 const draw=()=>{sheet(`<h3>ส่งออก</h3><div class="seg" role="group" aria-label="ช่วงเวลา">${[['m',mMid(cur)],['y','ปี '+(+cur.slice(0,4)+543)],['a','ทั้งหมด']].map(([v,l])=>`<button data-rg="${v}" aria-pressed="${rg===v}">${l}</button>`).join('')}</div><p class="hint">${rows().length} รายการ · Excel มีชีตสรุปตามหมวดและรายเดือนให้ด้วย</p><button class="btn pri" id="xX">Excel (.xlsx)</button><button class="btn" id="xC">CSV (เปิดได้ทุกแอพ)</button><button class="btn" id="xB">${svg('cloud','s')}ไฟล์สำรองทั้งหมด (.json)</button>`);
  $$('#pan [data-rg]').forEach(b=>b.onclick=()=>{rg=b.dataset.rg;draw()});
  $('#xX').onclick=()=>exportXLSX(rows(),tag());$('#xC').onclick=()=>{const L=rows();if(!L.length){toast('ไม่มีรายการในช่วงนี้');return}webDL.save(`jodngern-${tag()}.csv`,'\ufeff'+toCSV(L))};$('#xB').onclick=doBackup};draw()}
async function exportXLSX(L,tag){if(!L.length){toast('ไม่มีรายการในช่วงนี้');return}try{await loadXLSX()}catch(e){toast('โหลดตัวสร้าง Excel ไม่ได้ (ต้องต่อเน็ต) ลองใช้ CSV แทน');return}
 L=[...L].sort((a,b)=>a.d.localeCompare(b.d));const U=XLSX.utils,wb=U.book_new(),ws=U.aoa_to_sheet([HEAD,...L.map(rowOf)]);ws['!cols']=[{wch:12},{wch:9},{wch:22},{wch:12},{wch:36},{wch:14}];U.book_append_sheet(wb,ws,'รายการ');
 const bc={};for(const t of L){const k=t.c+'|'+t.t;(bc[k]||(bc[k]={id:t.c,c:catOf(t.c).name,t:t.t==='i'?'รายรับ':'รายจ่าย',a:0,n:0})).a+=t.a;bc[k].n++}
 U.book_append_sheet(wb,U.aoa_to_sheet([['หมวดหมู่','ประเภท','รวม','จำนวนรายการ','งบต่อเดือน'],...Object.values(bc).sort((a,b)=>a.t.localeCompare(b.t)||b.a-a.a).map(v=>[v.c,v.t,Math.round(v.a*100)/100,v.n,S.budgets[v.id]||''])]),'สรุปตามหมวด');
 const bm={};for(const t of L){const k=t.d.slice(0,7);(bm[k]||(bm[k]={i:0,e:0}))[t.t==='i'?'i':'e']+=t.a}
 U.book_append_sheet(wb,U.aoa_to_sheet([['เดือน','รายรับ','รายจ่าย','คงเหลือ'],...Object.keys(bm).sort().map(k=>[k,Math.round(bm[k].i*100)/100,Math.round(bm[k].e*100)/100,Math.round((bm[k].i-bm[k].e)*100)/100])]),'สรุปรายเดือน');
 U.book_append_sheet(wb,U.aoa_to_sheet([['รายการ','ยอด','ความถี่','วันที่','เดือน (รายปี)','เปิดอยู่'],...S.subs.filter(s=>s.amt>0).map(s=>[s.name,s.amt,s.f==='y'?'ทุกปี':'ทุกเดือน',s.day||'',s.f==='y'?ML[(s.mo||1)-1]:'',s.on?'ใช่':'ไม่'])]),'รายจ่ายประจำ');
 webDL.save(`jodngern-${tag}.xlsx`,new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})]))}
function wipeAll(){sheet(`<h3>ลบข้อมูลทั้งหมด?</h3><p class="mut2">รายการ ${all().length} รายการ หมวด กระเป๋า รายจ่ายประจำ และสินทรัพย์จะถูกลบจากเครื่องนี้ กู้คืนได้เฉพาะถ้ามีไฟล์สำรอง</p><button class="btn" id="wB">${svg('cloud','s')}สำรองก่อน</button><label class="fl">พิมพ์คำว่า ลบ เพื่อยืนยัน<input class="inp" id="wC" autocomplete="off"></label><div class="acts"><button class="btn" data-close>ยกเลิก</button><button class="btn pri" id="wGo" style="background:var(--acc);border-color:var(--acc);color:#fff">ลบทั้งหมด</button></div>`);
 $('#wB').onclick=doBackup;$('#wGo').onclick=()=>{if($('#wC').value.trim()!=='ลบ'){$('#wC').focus();return}S=NEWS();writeNow();closeSheet();location.hash='#welcome';render();toast('ลบข้อมูลทั้งหมดแล้ว')}}

/* ---------- boot ---------- */
load().then(()=>{ready=true;applyTheme();if(!location.hash)location.replace(S.welcomed||hasData()?'#home':'#welcome');render();lastRoute=route});
</script>
<script>if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&window.self===window.top)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
